name: Generate pacman animation

# Pausiert seit Oktober 2026, der 3D-Kalender hat Pac-Man im README abgeloest.
# Der Branch "output" mit den letzten Pac-Man-Bildern bleibt erhalten.
# Zum Zurueckwechseln den Zeitplan und den Push-Ausloeser wieder einkommentieren.
on:
  # schedule: # execute every 12 hours, at minute 0
  #   - cron: "0 */12 * * *"

  workflow_dispatch:

  # push:
  #   branches:
  #   - main

# Never let two runs push to the output branch at the same time.
concurrency:
  group: pacman
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate the contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Gueltige Werte laut action.yml sind ausschliesslich:
          #   pacman, breakout, galaga, puzzle-bobble, bomberman
          # Ein unbekannter Wert laesst die Action ohne Ausgabe abbrechen,
          # der Push-Schritt scheitert dann mit "Build dir does not exist".
          games: pacman
          # Nur fuer Pacman: opportunistic (Standard), conservative, aggressive
          player_style: conservative


      - name: push the generated graph to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
