name: Generate 3D contribution calendar

on:
  schedule: # einmal taeglich um 03:17 UTC
    - cron: "17 3 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

# Nie zwei Laeufe gleichzeitig in den Ausgabe-Branch schreiben lassen.
concurrency:
  group: profile-3d-contrib
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Holt das Repo, damit Einstellungsdatei und Skript da sind
      - uses: actions/checkout@v5

      # Version festgeschrieben: das Aufraeumskript kennt den Aufbau genau dieser Version
      - name: generate the 3D calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      # Entfernt Netzgrafik, Sterne und Forks. Bricht ab, wenn der Aufbau nicht passt.
      - name: remove radar chart, stars and forks
        run: python3 .github/scripts/svg_aufraeumen.py profile-3d-contrib/*.svg

      - name: push the images to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-3d-contrib
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
